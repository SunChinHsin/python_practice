<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 語法除錯大闖關</title>
  <style>
    :root {
      --primary: #4A90E2;
      --success: #2ECC71;
      --danger: #E74C3C;
      --bg: #F5F7FA;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 8px;
      background-color: #E0E0E0;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-tag {
      background-color: #EBF5FF;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .code-block {
      background-color: #272822;
      color: #F8F8F2;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.05rem;
      white-space: pre-wrap;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #F8F9FA;
      border: 2px solid #E9ECEF;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      font-family: monospace;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #F0F7FF;
    }

    .option-btn.correct {
      background-color: #E8F8F0;
      border-color: var(--success);
      color: #1E7E34;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #FCEAE9;
      border-color: var(--danger);
      color: #B02A37;
    }

    .feedback {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.4;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct-bg {
      background-color: #E8F8F0;
      color: #1E7E34;
      border-left: 5px solid var(--success);
    }

    .feedback.incorrect-bg {
      background-color: #FCEAE9;
      color: #B02A37;
      border-left: 5px solid var(--danger);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-secondary {
      background-color: #6C757D;
      color: white;
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #357ABD;
    }

    .completion-screen {
      text-align: center;
      padding: 20px 0;
      display: none;
    }

    .completion-screen.active {
      display: block;
    }

    .trophy {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .completion-title {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    .completion-desc {
      font-size: 1.1rem;
      color: #6C757D;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="quiz-screen">
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    
    <div class="header">
      <span class="step-tag" id="step-tag">關卡 1 / 5</span>
    </div>

    <p style="font-weight: bold; margin-bottom: 8px;">以下程式碼有語法錯誤，請找出正確修正後的程式碼：</p>
    <div class="code-block" id="code-snippet"></div>

    <div class="options" id="options-container"></div>

    <div class="feedback" id="feedback-box"></div>

    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>上一題</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">下一題</button>
    </div>
  </div>

  <div class="completion-screen" id="completion-screen">
    <div class="trophy">🎉</div>
    <div class="completion-title">好棒棒！順利通關！</div>
    <div class="completion-desc">你已經掌握了 print 與 input 的核心觀念與常見避坑技巧！</div>
    <button class="btn btn-primary" onclick="restartQuiz()">再挑戰一次 🔄</button>
  </div>
</div>

<script>
  const rawQuestions = [
    {
      id: 1,
      code: 'name = "小明"\nprint("你好" name)',
      options: [
        'print("你好", name)',
        'print("你好" name)',
        'print("你好" = name)',
        'print("你好" + name)'
      ],
      answer: 0,
      explanation: "💡 觀念說明：在 print 中輸出多個項目時，中間必須使用「逗號 (,)」分隔。"
    },
    {
      id: 2,
      code: 'print(歡迎來到Python世界)',
      options: [
        'print(歡迎來到Python世界)',
        'print("歡迎來到Python世界")',
        'print(歡迎來到Python世界")',
        'print("歡迎來到Python世界)'
      ],
      answer: 1,
      explanation: "💡 觀念說明：純文字（字串）必須用成對的單引號 ' ' 或雙引號 \" \" 包裹起來。"
    },
    {
      id: 5,
      code: 'score = 100\nprint("你的得分是：" = score)',
      options: [
        'print("你的得分是：" == score)',
        'print("你的得分是：" = score)',
        'print("你的得分是：", score)',
        'print("你的得分是："+= score)'
      ],
      answer: 2,
      explanation: "💡 觀念說明：print() 是輸出函式，不能在裡面使用等號 '=' 進行賦值作業，請使用逗號分隔。"
    },
    {
      id: 6,
      code: 'age = input("請輸入年齡：")\nnext_year = age + 1',
      options: [
        'age = input("請輸入年齡：")\nnext_year = age + 1',
        'age = int(input("請輸入年齡："))\nnext_year = age + 1',
        'age = str(input("請輸入年齡："))\nnext_year = age + 1',
        'age = input("請輸入年齡：" + 1)'
      ],
      answer: 1,
      explanation: "💡 觀念說明：input() 回傳的資料型態永遠是字串 (str)，若要進行數學加減計算，必須加上 int() 轉為整數。"
    },
    {
      id: 7,
      code: '# 想要提示使用者輸入名字，但寫成：\nname = input(小明)',
      options: [
        'name = input(小明)',
        'name = input("請輸入你的名字：")',
        'name = input(name)',
        'name = input(123)'
      ],
      answer: 1,
      explanation: "💡 觀念說明：input() 括號內應該放入給使用者看的「提示字串」，不能直接放入未定義的變數名稱或一般數字。"
    }
  ];

  let questions = [];
  let currentStep = 0;
  let userAnswers = {};

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    const newArr = [...array];
    while (currentIndex !== 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [newArr[currentIndex], newArr[randomIndex]] = [newArr[randomIndex], newArr[currentIndex]];
    }
    return newArr;
  }

  function initQuiz() {
    questions = shuffle(rawQuestions);
    currentStep = 0;
    userAnswers = {};
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("completion-screen").classList.remove("active");
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentStep];
    document.getElementById("step-tag").innerText = `關卡 ${currentStep + 1} / ${questions.length}`;
    document.getElementById("progress").style.width = `${((currentStep + 1) / questions.length) * 100}%`;
    document.getElementById("code-snippet").innerText = q.code;

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    const hasAnswered = userAnswers[currentStep] !== undefined;

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      
      if (hasAnswered) {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add("correct");
        }
        if (userAnswers[currentStep] === idx && idx !== q.answer) {
          btn.classList.add("incorrect");
        }
      } else {
        btn.onclick = () => selectOption(idx);
      }

      optionsContainer.appendChild(btn);
    });

    const feedbackBox = document.getElementById("feedback-box");
    if (hasAnswered) {
      const isCorrect = userAnswers[currentStep] === q.answer;
      feedbackBox.className = `feedback show ${isCorrect ? 'correct-bg' : 'incorrect-bg'}`;
      feedbackBox.innerHTML = `<strong>${isCorrect ? '⭕ 答對了！' : '❌ 答錯囉！'}</strong><br>${q.explanation}`;
    } else {
      feedbackBox.className = "feedback";
      feedbackBox.innerHTML = "";
    }

    document.getElementById("prev-btn").disabled = currentStep === 0;
    document.getElementById("next-btn").innerText = currentStep === questions.length - 1 ? "完成闖關 🏆" : "下一題 ➡️";
  }

  function selectOption(index) {
    userAnswers[currentStep] = index;
    renderQuestion();
  }

  function nextQuestion() {
    if (currentStep < questions.length - 1) {
      currentStep++;
      renderQuestion();
    } else {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("completion-screen").classList.add("active");
    }
  }

  function prevQuestion() {
    if (currentStep > 0) {
      currentStep--;
      renderQuestion();
    }
  }

  function restartQuiz() {
    initQuiz();
  }

  window.onload = initQuiz;
</script>

</body>
</html>
